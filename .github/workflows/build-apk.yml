name: Compilar APK Debug

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Preparar debug.keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Preparar variables de entorno (.env) si hay secretos
        run: |
          if [ -n "${{ secrets.SUPABASE_URL }}" ] || [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            {
              echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
              echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
              if [ -n "${{ secrets.SUPABASE_SERVICE_KEY }}" ]; then
                echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}"
              else
                echo "SUPABASE_SERVICE_KEY=YOUR_SUPABASE_SERVICE_KEY"
              fi
            } > .env
          fi

      - name: Compilar APK Debug
        run: gradle :app:assembleDebug --no-daemon

      - name: Subir APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: control-de-extracciones-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
